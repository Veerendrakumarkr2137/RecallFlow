<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0b0f19" />
  <rect width="98" height="98" x="1" y="1" rx="23" stroke="url(#flowGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  <!-- Wave / Flow nodes -->
  <path d="M25 50 C 35 30, 45 70, 55 45 C 65 20, 75 60, 75 50" stroke="url(#flowGrad)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <circle cx="25" cy="50" r="5" fill="#38bdf8" />
  <circle cx="55" cy="45" r="5.5" fill="#818cf8" />
  <circle cx="75" cy="50" r="5" fill="#a855f7" />
</svg>
